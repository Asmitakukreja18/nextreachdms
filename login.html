<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketiqx | Dashboard Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --brand-primary: #0ea5e9;
      --brand-hover: #0284c7;
      --radius-lg: 16px;
      --radius-md: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 48px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
      text-align: center;
    }

    .brand {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .brand-icon {
      color: var(--brand-primary);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 40px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
    }

    input {
      padding: 14px 16px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--brand-primary);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background-color: var(--brand-primary);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
      font-family: 'Inter', sans-serif;
      margin-top: 10px;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background-color: var(--brand-hover);
    }

    .back-home {
      display: block;
      margin-top: 24px;
      color: var(--text-muted);
      font-size: 0.9rem;
      text-decoration: none;
    }
    .back-home:hover {
      color: var(--brand-primary);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand">
      <svg class="brand-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
      Marketiqx
    </div>
    <div class="subtitle">Log in to your WhatsApp Dashboard</div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Username or Email</label>
        <input type="text" id="email" value="admin@marketiqx.com" placeholder="admin or admin@marketiqx.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" value="admin123" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn">Login to Dashboard 🚀</button>
    </form>

    <a href="index.html" class="back-home">← Back to Website</a>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      localStorage.setItem('marketiqx_auth', 'true');
      localStorage.setItem('marketiqx_user', email || 'admin@marketiqx.com');
      window.location.href = 'dashboard.html';
    }
  </script>
  <script src="js/site.js"></script>
</body>
</html>
